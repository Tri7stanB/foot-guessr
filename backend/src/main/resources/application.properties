spring.application.name=foot-guessr

# Render impose son port via la variable PORT ; 8080 en local
server.port=${PORT:8080}

# Datasource H2 en mémoire
spring.datasource.url=jdbc:h2:mem:footguessr
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Console web H2 : à laisser désactivée, elle donne un accès complet à la base
# sans mot de passe. La repasser à true ponctuellement pour déboguer en local.
spring.h2.console.enabled=false